<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="./connections.png">
  <title>LinkedIn Connections Search</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Optional: Keep Bootstrap & Font Awesome (or remove Bootstrap if switching fully to Tailwind) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />

  <!-- CSV Parser -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Custom scripts and styles -->
  <script defer src="script.js?v=20260521-4"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gradient-to-br from-indigo-400 to-purple-600 min-h-screen font-sans text-gray-800">

  <div class="container mx-auto p-2 sm:p-4">
    <div class="bg-white/90 rounded-2xl shadow-xl px-4 sm:px-6 py-6 sm:py-10 max-w-6xl mx-auto">
      <div class="text-center mb-6 sm:mb-8">
        <h1 class="text-2xl sm:text-4xl font-extrabold text-indigo-700">
          <i class="fas fa-search me-2"></i> LinkedIn Connections Search
        </h1>
        <p class="text-gray-600 mt-2 text-base sm:text-lg">Search connections by company or browse all companies with LinkedIn jobs links</p>
      </div>

      <div class="tab-bar flex gap-2 mb-6">
        <button id="tabConnections" type="button" class="tab-btn tab-btn-active" aria-selected="true">
          <i class="fas fa-users me-2"></i> Connections
        </button>
        <button id="tabJobs" type="button" class="tab-btn" aria-selected="false">
          <i class="fas fa-building me-2"></i> Companies
        </button>
      </div>

      <div id="connectionsPanel">
      <div class="bg-gradient-to-r from-pink-400 to-red-400 p-4 sm:p-6 rounded-xl shadow mb-6">
        <div class="flex flex-col gap-4">
          <div class="relative w-full">
            <input
              type="text"
              id="companySearch"
              placeholder="Enter company name (e.g., Amazon, Google, Microsoft)"
              class="w-full rounded-full px-4 sm:px-5 py-3 pr-12 text-base sm:text-lg shadow focus:outline-none focus:ring-2 focus:ring-white"
            />
            <button id="clearSearchBtn" type="button" class="absolute right-10 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none text-xl hidden" aria-label="Clear search">&times;</button>
            <div id="companySuggestions" class="company-suggestions absolute w-full z-20 bg-white rounded-b-lg border border-gray-300 shadow-lg max-h-60 overflow-y-auto hidden"></div>
          </div>
        </div>
      </div>

      <div id="statsContainer" class="flex flex-col sm:flex-row justify-between gap-4 mb-6 hidden">
        <div class="bg-gradient-to-r from-teal-200 to-lime-200 p-4 sm:p-6 rounded-xl w-full sm:w-72 text-center shadow">
          <div class="text-2xl sm:text-3xl font-bold text-gray-700" id="anvayCount">0</div>
          <div class="text-gray-600 mt-1 text-sm sm:text-base">Anvay's Connections</div>
        </div>
        <div class="bg-gradient-to-r from-yellow-200 to-pink-200 p-4 sm:p-6 rounded-xl w-full sm:w-72 text-center shadow">
          <div class="text-2xl sm:text-3xl font-bold text-gray-700" id="anilCount">0</div>
          <div class="text-gray-600 mt-1 text-sm sm:text-base">Anil's Connections</div>
        </div>
        <div class="bg-gradient-to-r from-sky-200 to-purple-200 p-4 sm:p-6 rounded-xl w-full sm:w-72 text-center shadow">
          <div class="text-2xl sm:text-3xl font-bold text-gray-700" id="bilwaCount">0</div>
          <div class="text-gray-600 mt-1 text-sm sm:text-base">Bilwa's Connections</div>
        </div>
      </div>

      <div id="resultsContainer" class="mt-6 sm:mt-8"></div>
      </div>

      <div id="jobsPanel" class="hidden">
        <div class="bg-gradient-to-r from-indigo-400 to-blue-400 p-4 sm:p-6 rounded-xl shadow mb-6">
          <div class="flex flex-col sm:flex-row gap-4 sm:items-center sm:justify-between">
            <div>
              <h2 class="text-xl sm:text-2xl font-bold text-white">All Companies</h2>
              <p class="text-indigo-100 mt-1 text-sm sm:text-base">Every company from your connections with a link to their LinkedIn jobs page</p>
            </div>
            <div class="w-full sm:w-auto">
              <input
                type="text"
                id="jobsTableFilter"
                placeholder="Filter companies..."
                class="w-full sm:w-64 rounded-full px-4 py-2 text-base shadow focus:outline-none focus:ring-2 focus:ring-white"
              />
            </div>
          </div>
        </div>
        <div id="jobsMeta" class="text-sm text-gray-600 mb-4"></div>
        <div id="jobsTableContainer" class="companies-table-container"></div>
      </div>
    </div>
  </div>
</body>
</html>
